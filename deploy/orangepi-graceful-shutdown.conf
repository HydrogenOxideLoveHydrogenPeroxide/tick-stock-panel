# Orange Pi systemd drop-in: bound SSE connection draining during deployments.
# Install as /etc/systemd/system/tick-stock-panel.service.d/60-graceful-shutdown.conf
[Service]
ExecStart=
ExecStart=/mnt/emmc/stock-panel/tick-stock-panel/backend/.venv/bin/python -m uvicorn app.main:app --host 127.0.0.1 --port 3018 --no-proxy-headers --loop asyncio --timeout-graceful-shutdown 5
TimeoutStopSec=30
